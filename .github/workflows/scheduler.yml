name: ZAD Cloud Publisher V2

on:
  schedule:
    - cron: '0 * * * *' # تشغيل تلقائي كل ساعة
  workflow_dispatch: # زر للتشغيل اليدوي من GitHub

jobs:
  run-publisher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir pandas openpyxl pytz requests

      - name: Run ZAD Publisher Script
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          python zadpostscheduler.py

      - name: Commit and push updated Excel status
        run: |
          git config --global user.name "ZAD Automation Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add schedule.xlsx
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update post statuses to posted [skip ci]" && git push)